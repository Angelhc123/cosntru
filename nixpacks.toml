[phases.setup]
nixPkgs = ['nodejs_20', 'python310', 'python310Packages.pip', 'python310Packages.virtualenv', 'php82', 'php82Packages.composer']

[phases.install]
cmds = [
    'npm --version',
    'node --version',
    'python3 --version',
    'php --version'
]

[phases.build]
cmds = ['bash setup_railway.sh']

[start]
cmd = 'bash start_railway.sh'
