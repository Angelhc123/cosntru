<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test RF004 - Recuperación de Contraseña</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 14px;
        }
        
        .chat-container {
            padding: 20px;
            min-height: 400px;
            max-height: 500px;
            overflow-y: auto;
            background: #f8f9fa;
        }
        
        .message {
            margin-bottom: 15px;
            animation: slideIn 0.3s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .message.user {
            text-align: right;
        }
        
        .message-bubble {
            display: inline-block;
            padding: 12px 18px;
            border-radius: 18px;
            max-width: 80%;
            word-wrap: break-word;
        }
        
        .message.user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .message.bot .message-bubble {
            background: white;
            color: #333;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .message-time {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 5px;
        }
        
        .input-container {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }
        
        .input-group {
            display: flex;
            gap: 10px;
        }
        
        #messageInput {
            flex: 1;
            padding: 12px 18px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }
        
        #messageInput:focus {
            border-color: #667eea;
        }
        
        #sendBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        #sendBtn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        #sendBtn:active {
            transform: translateY(0);
        }
        
        #sendBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .typing-indicator {
            display: inline-flex;
            gap: 4px;
            padding: 12px 18px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }
        
        .typing-indicator span:nth-child(1) {
            animation-delay: -0.32s;
        }
        
        .typing-indicator span:nth-child(2) {
            animation-delay: -0.16s;
        }
        
        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
            }
            40% {
                transform: scale(1);
            }
        }
        
        .status-bar {
            background: #f8f9fa;
            padding: 10px 20px;
            font-size: 12px;
            color: #666;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4caf50;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }
        
        .quick-tests {
            padding: 20px;
            background: #f0f0f0;
            border-top: 1px solid #e0e0e0;
        }
        
        .quick-tests h3 {
            font-size: 14px;
            margin-bottom: 10px;
            color: #666;
        }
        
        .quick-tests button {
            background: white;
            border: 1px solid #ddd;
            padding: 8px 15px;
            border-radius: 15px;
            margin: 5px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        
        .quick-tests button:hover {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .log-container {
            margin-top: 20px;
            padding: 15px;
            background: #1e1e1e;
            color: #00ff00;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .log-entry {
            margin-bottom: 5px;
            line-height: 1.4;
        }
        
        .log-timestamp {
            color: #888;
        }
        
        .log-info { color: #00ff00; }
        .log-error { color: #ff5555; }
        .log-warning { color: #ffff55; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 Test RF004</h1>
            <p>Recuperación de Contraseña con DialogFlow</p>
        </div>
        
        <div class="status-bar">
            <div class="status-indicator">
                <div class="status-dot"></div>
                <span>Conectado al NLP Service</span>
            </div>
            <span id="sessionId">Sesión: Cargando...</span>
        </div>
        
        <div class="chat-container" id="chatContainer">
            <div class="message bot">
                <div class="message-bubble">
                    👋 ¡Hola! Soy el asistente virtual de UPT. 
                    <br><br>
                    Puedo ayudarte a recuperar tu contraseña. Solo dime: <strong>"olvidé mi contraseña"</strong>
                </div>
                <div class="message-time">Ahora</div>
            </div>
        </div>
        
        <div class="quick-tests">
            <h3>⚡ Pruebas Rápidas:</h3>
            <button onclick="sendQuickMessage('olvidé mi contraseña')">Olvidé mi contraseña</button>
            <button onclick="sendQuickMessage('resetear password')">Resetear password</button>
            <button onclick="sendQuickMessage('no puedo acceder')">No puedo acceder</button>
        </div>
        
        <div class="input-container">
            <div class="input-group">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="Escribe tu mensaje..."
                    autocomplete="off"
                />
                <button id="sendBtn" onclick="sendMessage()">Enviar</button>
            </div>
        </div>
        
        <div style="padding: 20px;">
            <h3 style="font-size: 14px; margin-bottom: 10px; color: #666;">📊 Logs de Debug:</h3>
            <div class="log-container" id="logContainer">
                <div class="log-entry log-info">
                    <span class="log-timestamp">[00:00:00]</span> Sistema iniciado...
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_GATEWAY_URL = 'http://localhost:3000/api/v1';
        let sessionId = generateSessionId();
        
        // Mostrar session ID
        document.getElementById('sessionId').textContent = `Sesión: ${sessionId.substring(0, 8)}...`;
        
        function generateSessionId() {
            return 'test_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }
        
        function addLog(message, type = 'info') {
            const logContainer = document.getElementById('logContainer');
            const timestamp = new Date().toLocaleTimeString();
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry log-${type}`;
            logEntry.innerHTML = `<span class="log-timestamp">[${timestamp}]</span> ${message}`;
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        }
        
        function addMessage(text, isUser = false) {
            const chatContainer = document.getElementById('chatContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'bot'}`;
            
            const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            
            messageDiv.innerHTML = `
                <div class="message-bubble">${text}</div>
                <div class="message-time">${time}</div>
            `;
            
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        function showTypingIndicator() {
            const chatContainer = document.getElementById('chatContainer');
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot';
            typingDiv.id = 'typing-indicator';
            typingDiv.innerHTML = `
                <div class="typing-indicator">
                    <span></span>
                    <span></span>
                    <span></span>
                </div>
            `;
            chatContainer.appendChild(typingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
        
        function removeTypingIndicator() {
            const typingIndicator = document.getElementById('typing-indicator');
            if (typingIndicator) {
                typingIndicator.remove();
            }
        }
        
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            // Agregar mensaje del usuario
            addMessage(message, true);
            addLog(`📤 Usuario: "${message}"`);
            input.value = '';
            
            // Deshabilitar botón
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            
            // Mostrar indicador de escritura
            showTypingIndicator();
            
            try {
                addLog('🔄 Enviando request al NLP Service...', 'info');
                
                const response = await fetch(`${API_GATEWAY_URL}/nlp/process`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        text: message,
                        session_id: sessionId,
                        language: 'es'
                    })
                });
                
                addLog(`📥 Respuesta HTTP: ${response.status} ${response.statusText}`, 
                       response.ok ? 'info' : 'error');
                
                if (!response.ok) {
                    const errorText = await response.text();
                    addLog(`❌ Error del servidor: ${errorText}`, 'error');
                    throw new Error(`HTTP ${response.status}`);
                }
                
                const data = await response.json();
                addLog(`✅ Datos recibidos: ${JSON.stringify(data, null, 2)}`, 'info');
                
                removeTypingIndicator();
                
                // Extraer respuesta del bot
                let botResponse = '';
                
                if (data.success && data.data) {
                    addLog(`🎯 Intent: ${data.data.intent || 'N/A'} (Confianza: ${(data.data.confidence * 100).toFixed(1)}%)`, 'info');
                    
                    if (data.data.response) {
                        botResponse = data.data.response;
                    } else if (data.data.dialogflow_response) {
                        botResponse = data.data.dialogflow_response;
                    } else if (data.data.faq_answer) {
                        botResponse = data.data.faq_answer;
                    } else {
                        botResponse = 'Lo siento, no entendí tu pregunta. 🤔';
                        addLog('⚠️ No se encontró respuesta en los datos', 'warning');
                    }
                } else {
                    botResponse = 'Disculpa, hubo un error al procesar tu mensaje.';
                    addLog('❌ Respuesta sin éxito o sin datos', 'error');
                }
                
                // Mostrar respuesta
                addMessage(botResponse);
                addLog(`📨 Bot: "${botResponse}"`);
                
            } catch (error) {
                removeTypingIndicator();
                addLog(`❌ Error: ${error.message}`, 'error');
                addMessage('Lo siento, hubo un error de conexión. Por favor, verifica que el NLP Service esté corriendo. 🔧');
            } finally {
                sendBtn.disabled = false;
                input.focus();
            }
        }
        
        function sendQuickMessage(message) {
            document.getElementById('messageInput').value = message;
            sendMessage();
        }
        
        // Enter para enviar
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
        
        // Focus al input
        document.getElementById('messageInput').focus();
        
        addLog('✅ Sistema listo. Puedes empezar a probar el flujo de recuperación de contraseña.', 'info');
        addLog(`🔑 Session ID generado: ${sessionId}`, 'info');
    </script>
</body>
</html>
