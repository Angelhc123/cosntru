version: '3.8'

services:
  # DB Seeder Service (para poblar MongoDB Atlas)
  db-seeder:
    build:
      context: ./services/db-seeder
      dockerfile: Dockerfile
    container_name: upt-db-seeder
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3001
      MONGODB_URI: ${MONGODB_URI}
      LOG_LEVEL: info
    ports:
      - "3001:3001"
    networks:
      - upt-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # API Gateway
  api-gateway:
    build:
      context: ./services/api-gateway
      dockerfile: Dockerfile
    container_name: upt-api-gateway
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      MONGODB_URI: ${MONGODB_URI}
      JWT_SECRET: ${JWT_SECRET:-upt_jwt_secret_key_change_in_production}
      JWT_EXPIRES_IN: 7d
      RATE_LIMIT_MAX: 100
      RATE_LIMIT_WINDOW_MS: 60000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:4200}
      LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      db-seeder:
        condition: service_healthy
    volumes:
      - ./services/api-gateway/src:/usr/src/app/src
      - /usr/src/app/node_modules
    networks:
      - upt-network
    command: npm run start:dev

  # Chat Service (Placeholder - será desarrollado)
  chat-service:
    build:
      context: ./services/chat-service
      dockerfile: Dockerfile
    container_name: upt-chat-service
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3002
      MONGODB_URI: ${MONGODB_URI}
    ports:
      - "3002:3002"
    depends_on:
      db-seeder:
        condition: service_healthy
    networks:
      - upt-network
    profiles:
      - full-stack

  # NLP Service (Placeholder - será desarrollado en Python)
  nlp-service:
    build:
      context: ./services/nlp-service
      dockerfile: Dockerfile
    container_name: upt-nlp-service
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3003
      MONGODB_URI: ${MONGODB_URI}
    ports:
      - "3003:3003"
    depends_on:
      db-seeder:
        condition: service_healthy
    networks:
      - upt-network
    profiles:
      - full-stack

  # Knowledge Base Service (Placeholder)
  knowledge-base-service:
    build:
      context: ./services/knowledge-base-service
      dockerfile: Dockerfile
    container_name: upt-knowledge-base
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3004
      MONGODB_URI: ${MONGODB_URI}
    ports:
      - "3004:3004"
    depends_on:
      db-seeder:
        condition: service_healthy
    networks:
      - upt-network
    profiles:
      - full-stack

  # Analytics Service (Placeholder)
  analytics-service:
    build:
      context: ./services/analytics-service
      dockerfile: Dockerfile
    container_name: upt-analytics
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3005
      MONGODB_URI: ${MONGODB_URI}
    ports:
      - "3005:3005"
    depends_on:
      db-seeder:
        condition: service_healthy
    networks:
      - upt-network
    profiles:
      - full-stack

  # Notification Service (Placeholder)
  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: upt-notifications
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3006
      MONGODB_URI: ${MONGODB_URI}
    ports:
      - "3006:3006"
    depends_on:
      db-seeder:
        condition: service_healthy
    networks:
      - upt-network
    profiles:
      - full-stack

# Volumes removidos - usando MongoDB Atlas

networks:
  upt-network:
    driver: bridge